version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # one PR for the routine minor/patch churn
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # majors handled deliberately in a phase branch, not by bot
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
