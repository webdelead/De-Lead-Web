name: Supabase keep-alive

# Free-tier Supabase pauses after ~7 days of no activity. Ping 4×/week.
on:
  schedule:
    - cron: "17 6 * * 1" # Mon 06:17 UTC
    - cron: "17 6 * * 3" # Wed
    - cron: "17 6 * * 5" # Fri
    - cron: "17 6 * * 0" # Sun
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --filter @delead/db --frozen-lockfile=false
      - run: pnpm --filter @delead/db ping github
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
