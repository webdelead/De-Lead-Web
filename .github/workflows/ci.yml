name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: lead-capture.js copies in sync
        run: node scripts/sync-lead-capture.mjs --check

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        # Blocking. All 7 apps carry @delead/config's flat config. Warnings are
        # allowed (no --max-warnings); the pre-existing backlog is downgraded to
        # `warn` in the base config (react-hooks/*) and the 5 marketing configs
        # (no-unescaped-entities, no-html-link-for-pages — the html2jsx split).
        # Each redesign/<site> branch removes its leniency block.
        run: pnpm lint

      - name: Audit (high+)
        # Blocking. To silence an advisory with no upgrade path, add its CVE/GHSA
        # to pnpm.auditConfig.ignoreCves / ignoreGhsas in the root package.json.
        run: pnpm audit --audit-level=high

      - name: Build all
        # CI may build without a database. BUILD_ALLOW_DB_FALLBACK=1 lets
        # buildSafe() fall back to empty content here; real deploys never set it,
        # so a DB outage fails their build instead of caching empty ISR pages.
        # The dashboard's Supabase client only needs *some* URL/key at build to
        # not throw during prerender — placeholders unless real secrets are set.
        run: pnpm build
        env:
          BUILD_ALLOW_DB_FALLBACK: "1"
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://placeholder.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          REVALIDATE_SECRET: ci-placeholder
          NEXT_PUBLIC_LEAD_ENDPOINT: https://admin.deleadint.com/api/lead

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @delead/dashboard test

  # Visual-regression gate for the CSS->Tailwind migration. Runs only on
  # redesign/* branches, and only for apps that have committed baselines under
  # apps/<name>/e2e/__screenshots__/ (added on each redesign/<site> branch —
  # see docs/MIGRATION-CSS-TO-TAILWIND.md). No-op until the first site migrates.
  visual:
    runs-on: ubuntu-latest
    if: startsWith(github.head_ref, 'redesign/') || startsWith(github.ref_name, 'redesign/')
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Find apps with committed baselines
        id: scan
        run: |
          apps=""
          for dir in apps/*/; do
            if ls "${dir}e2e/__screenshots__/"* > /dev/null 2>&1; then
              apps="$apps ${dir%/}"
            fi
          done
          apps="${apps# }"
          echo "apps=$apps" >> "$GITHUB_OUTPUT"
          [ -n "$apps" ] && echo "will check:$apps" || echo "no committed baselines yet - nothing to check"
      - if: steps.scan.outputs.apps != ''
        run: pnpm --filter @delead/config exec playwright install --with-deps chromium
      - name: Visual regression
        if: steps.scan.outputs.apps != ''
        env:
          BUILD_ALLOW_DB_FALLBACK: "1"
        run: |
          for app in ${{ steps.scan.outputs.apps }}; do
            echo "::group::visual $app"
            pnpm --filter "./$app" test:visual
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@v4
        if: failure() && steps.scan.outputs.apps != ''
        with:
          name: playwright-report
          path: |
            apps/*/playwright-report/
            apps/*/test-results/
          retention-days: 7
