packages:
  - "apps/*"
  - "packages/*"

# Shared toolchain versions — one source of truth. Reference as "catalog:" in
# each package.json. next / react / react-dom / eslint-config-next are pinned
# exact so every app resolves byte-identical framework versions (Next 16 line).
catalog:
  "@types/node": ^24.7.0
  "@types/react": ^19.0.4
  "@types/react-dom": ^19.0.2
  dotenv: ^16.4.7
  drizzle-orm: ^0.45.2
  eslint-config-next: 16.3.4
  next: 16.3.4
  react: 19.2.8
  react-dom: 19.2.8
  tailwindcss: ^4.0.0
  typescript: ^5.7.2
