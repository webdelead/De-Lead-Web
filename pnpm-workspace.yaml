packages:
  - "apps/*"
  - "packages/*"

# Shared toolchain versions — one source of truth. Reference as "catalog:" in
# each package.json. next / react / react-dom / eslint-config-next are pinned
# exact so every app resolves byte-identical framework versions (Next 16 line).
catalog:
  "@types/node": ^24.19.2
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  dotenv: ^16.4.7
  drizzle-orm: ^0.45.4
  eslint-config-next: 16.4.0
  next: 16.4.0
  react: 19.3.0
  react-dom: 19.3.0
  tailwindcss: ^4.0.0
  typescript: ^5.7.2
  "@playwright/test": ^1.64.0
